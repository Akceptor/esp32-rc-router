[platformio]
src_dir = src
test_dir = test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson
build_flags =
    -Isrc
    -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; App (src/app/*) and src/main.cpp are pure Arduino glue (Task 21): App unconditionally embeds
; the ESP32-only HAL implementations (Esp32UartPort, Esp32GpioOutput, Esp32AdcInput,
; NvsConfigStore) as plain members, which only exist under `#if defined(ARDUINO)`. There is no
; native test for App by design (see task-21-brief.md), so exclude both from the native build
; rather than compiling them off-target.
build_src_filter =
    +<*>
    -<app/>
    -<main.cpp>
lib_deps =
    bblanchon/ArduinoJson
build_flags =
    -Isrc
    -std=gnu++17
    -DNATIVE_BUILD
