[platformio]
src_dir = src
test_dir = test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson
build_flags =
    -Isrc
    -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson
build_flags =
    -Isrc
    -std=gnu++17
    -DNATIVE_BUILD
